# Everything needed to work on Facewoof, in containers. See the Makefile for
# the entry points; `make dev` is the one to start with.
name: facewoof

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: facewoof
      POSTGRES_PASSWORD: facewoof
      POSTGRES_DB: facewoof
    ports:
      # Loopback only. A published port defaults to 0.0.0.0, which would put a
      # database with a guessable password on every interface this machine has.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facewoof -d facewoof"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    # Pinned rather than assumed: the server's shutdown handler drains for up
    # to 8s (server/shutdown.js) and must finish before docker gives up and
    # SIGKILLs. 10s is Docker's default, written down so the two numbers are
    # visibly a pair.
    stop_grace_period: 10s
    environment:
      DATABASE_URL: postgres://facewoof:facewoof@db:5432/facewoof
      PORT: "3001"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./server:/app/server
      - ./package.json:/app/package.json:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:3000:5173"
    volumes:
      # Edits on the host reload in the container.
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.mjs:/app/vite.config.mjs
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
    depends_on:
      - api

  # One-shot: bring the database up to date. The same runner the production
  # image uses at start-up, so dev and production apply the same migrations in
  # the same order.
  migrate:
    build:
      context: .
      target: api
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://facewoof:facewoof@db:5432/facewoof
    volumes:
      - ./server:/app/server
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "migrate"]

  # The browser tests are not a service here: scripts/e2e.sh (`make e2e`)
  # runs them in Playwright's own image at the version package.json pins.

  lint:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "biome", "check", "."]

volumes:
  pgdata:

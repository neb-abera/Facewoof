# Everything needed to work on Facewoof, in containers. See the Makefile for
# the entry points; `make dev` is the one to start with.
name: facewoof

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: facewoof
      POSTGRES_PASSWORD: facewoof
      POSTGRES_DB: facewoof
    ports:
      # Loopback only. A published port defaults to 0.0.0.0, which would put a
      # database with a guessable password on every interface this machine has.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U facewoof -d facewoof']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://facewoof:facewoof@db:5432/facewoof
      PORT: '3001'
    env_file:
      - path: .env
        required: false
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./server:/app/server
      - ./package.json:/app/package.json:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    env_file:
      - path: .env
        required: false
    ports:
      - '127.0.0.1:3000:5173'
    volumes:
      # Edits on the host reload in the container.
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.mjs:/app/vite.config.mjs
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./postcss.config.js:/app/postcss.config.js
    depends_on:
      - api

  # One-shot: bring the database up to date. The same runner the production
  # image uses at start-up, so dev and production apply the same migrations in
  # the same order.
  migrate:
    build:
      context: .
      target: api
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://facewoof:facewoof@db:5432/facewoof
    volumes:
      - ./server:/app/server
    depends_on:
      db:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']

  # Browser tests against whatever BASE_URL points at. `make e2e` runs them
  # against the production image, which is the thing that actually ships.
  #
  # The default matches the container `make run` starts. It must not be a bare
  # `app`: .app is a real gTLD on Chromium's HSTS preload list (Google owns
  # it), so the browser force-upgrades any host with that name to https before
  # the first request leaves, and every test dies with ERR_SSL_PROTOCOL_ERROR
  # against a plain-HTTP instance. Nothing the server sends can prevent it —
  # the list ships inside the browser. The same goes for other preloaded TLDs
  # (dev, page, new, day): container names here should not collide with them.
  e2e:
    build:
      context: .
      target: e2e
    profiles: ['tools']
    environment:
      BASE_URL: ${BASE_URL:-http://facewoof-app:8080}
    volumes:
      - ./tests:/app/tests
      - ./playwright.config.js:/app/playwright.config.js:ro
    network_mode: ${E2E_NETWORK:-facewoof_default}

  lint:
    build:
      context: .
      target: dev
    profiles: ['tools']
    volumes:
      - .:/app
      - /app/node_modules
    command: ['npx', 'biome', 'check', '.']

volumes:
  pgdata:

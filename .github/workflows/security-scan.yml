name: security scan

# Known-CVE search inside the production image. The weekly schedule matters
# as much as the PR run: new CVEs are published against images that have not
# changed. Accepted findings live in .trivyignore with their reasoning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image-scan:
    name: container scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build production image
        run: docker build --target final -t scan-target .

      - name: scan for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: scan-target
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
          # SARIF output ignores the severity filter unless this is set,
          # which makes exit-code fire on LOW/MEDIUM noise.
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: upload findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy.sarif

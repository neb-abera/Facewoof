name: deploy

# Only from main, and only once the checks workflow has passed on it. Nothing
# reaches the internet that has not been linted, built and smoke tested.
on:
  workflow_run:
    workflows: ["checks"]
    branches: [main]
    types: [completed]
  # For redeploying the current main without a new commit.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  # Required for the OIDC token azure/login exchanges for credentials. There is
  # no client secret stored anywhere as a result: the trust is between this
  # repository's main branch and the Azure app registration.
  id-token: write
  contents: read

jobs:
  deploy:
    # workflow_run fires whether or not the checks passed, so a failed run has
    # to be filtered out here rather than assumed away.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE: facewoof
      CONTAINER_APP: ${{ vars.CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run checks out the default branch by default, which is
          # what we want, but be explicit about the commit that passed.
          #
          # Scorecard flags any workflow_run + head_sha checkout as a
          # potentially untrusted checkout. Here it is not: the trigger above
          # is gated to `branches: [main]`, so head_sha is always a commit
          # that already landed on main - never fork or PR code.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        # Built here and pushed, rather than with `az acr build`.
        #
        # `az acr build` schedules a task inside the registry, which needs
        # Microsoft.ContainerRegistry/registries/scheduleRun/action and ARM read
        # on the registry — in practice, Contributor on it. That registry
        # belongs to aberaTech, and a deploy identity for this app has no
        # business being able to delete another app's images. Building on the
        # runner keeps the grant to AcrPush plus Reader.
        # The Cloudinary pair are vite build args: the client resolves
        # import.meta.env when the bundle is built, so passing them to the
        # running container does nothing. Repository *variables*, not secrets
        # — both values ship in the bundle to every browser by design (the
        # preset is unsigned). Left unset they arrive empty, and the app hides
        # photo upload exactly as it does today, so the deploy stays safe
        # before they are configured.
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY%%.*}"
          docker build --target final \
            --build-arg VITE_CLOUD_NAME="${{ vars.VITE_CLOUD_NAME }}" \
            --build-arg VITE_UPLOAD_PRESET="${{ vars.VITE_UPLOAD_PRESET }}" \
            --tag "$REGISTRY/$IMAGE:${{ github.sha }}" \
            --tag "$REGISTRY/$IMAGE:run-${{ github.run_id }}" \
            --tag "$REGISTRY/$IMAGE:latest" \
            --file Dockerfile .
          docker push "$REGISTRY/$IMAGE:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE:run-${{ github.run_id }}"
          docker push "$REGISTRY/$IMAGE:latest"

      - name: Deploy the revision
        # The per-run tag, not the commit tag. A workflow_dispatch of the same
        # commit rebuilds and pushes the same :sha tag, and `az containerapp
        # update` treats an unchanged image reference as nothing to do — the
        # new build sat in the registry while production kept serving the old
        # one, and the run still reported success because the old revision was
        # healthy. A reference that is unique per run makes every run a real
        # rollout, which is the entire point of the manual trigger.
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:run-${{ github.run_id }}"

      - name: Wait for the new revision to be healthy
        # `az containerapp update` returns once the revision is created, not
        # once it is serving. Without this a broken deploy looks green.
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "checking https://$fqdn/healthz"
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 10 "https://$fqdn/healthz" > /tmp/health.json; then
              cat /tmp/health.json
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "revision did not become healthy within five minutes"
          az containerapp logs show --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" --tail 50 || true
          exit 1

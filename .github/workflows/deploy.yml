name: deploy

# Only from main, and only once the checks workflow has passed on it. Nothing
# reaches the internet that has not been linted, built and smoke tested.
on:
  workflow_run:
    workflows: ["checks"]
    branches: [main]
    types: [completed]
  # For redeploying the current main without a new commit.
  workflow_dispatch:

# One deploy at a time, never cancelled: a cancelled deploy is half a
# rollout. The group holds one running and one pending run, and a newer run
# replaces the pending one. Checks finish in any order, so the replaced run
# can be for a newer commit than the one that replaces it. Nothing is lost:
# every run deploys the tip of the default branch (the target job), not the
# commit that triggered it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Checks run once per commit, so two merges minutes apart can pass in
  # either order. Deploying the commit that triggered the run would then
  # roll production back to the older one. This job names the tip of the
  # default branch, and only once the tip's own checks have passed. While
  # they are still running it names nothing, and the tip's own run deploys.
  target:
    # workflow_run fires whether or not the checks passed, so a failed run has
    # to be filtered out here rather than assumed away.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - name: the tip of the default branch, once its checks passed
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
          CHECKS: ${{ github.event.workflow_run.workflow_id }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)
          # A manual redeploy takes the tip as it is.
          if [ "$EVENT" != workflow_dispatch ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CHECKS/runs?head_sha=$tip&status=success" --jq .total_count)
            if [ "$passed" = 0 ]; then
              echo "::notice::$BRANCH is at $tip and its checks have not passed yet. Its own run deploys it."
              exit 0
            fi
          fi
          echo "deploying $tip"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  # build, then migrate, then deploy. The image is built once and handed on as
  # an artifact, so the migrations run from the same bytes that serve, and a
  # failed migration stops the run before anything is pushed or rolled out.
  build:
    needs: target
    if: needs.target.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tip of main, checked, as the target job found it. Scorecard
          # flags a workflow_run checkout of a named commit as potentially
          # untrusted. This one is not: it is the head of main, never fork or
          # PR code.
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - name: Build the image
        # Built on the runner rather than with `az acr build`, which schedules
        # a task inside the registry and needs Contributor on it. That
        # registry belongs to aberaTech, and a deploy identity for this app
        # has no business being able to delete another app's images.
        #
        # The Cloudinary pair are vite build args: the client resolves
        # import.meta.env when the bundle is built, so passing them to the
        # running container does nothing. Repository *variables*, not secrets
        # — both values ship in the bundle to every browser by design (the
        # preset is unsigned). Left unset they arrive empty, and the app hides
        # photo upload exactly as it does today, so the deploy stays safe
        # before they are configured.
        run: |
          set -euo pipefail
          docker build --target final \
            --build-arg VITE_CLOUD_NAME="${{ vars.VITE_CLOUD_NAME }}" \
            --build-arg VITE_UPLOAD_PRESET="${{ vars.VITE_UPLOAD_PRESET }}" \
            --tag facewoof:deploy \
            --file Dockerfile .
          docker save facewoof:deploy | gzip -1 > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          if-no-files-found: error

  migrate:
    # As facewoof-migrator, the one identity whose Postgres role owns the
    # schema. It holds no Azure role and trusts one thing: a GitHub token for
    # this repository's main branch, through a federated credential in each
    # subject format. No `environment:` on this job on purpose. The subject
    # would then name the environment, and any branch can be dispatched into
    # an environment that has no branch policy.
    needs: [target, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load

      - name: Azure login, migrator identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DATABASE_MIGRATOR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Pending migrations
        run: scripts/migrate-production.sh facewoof:deploy list

      - name: Apply migrations as facewoof-migrator
        # Each migration commits on its own. The revision still serving runs
        # on the new schema until the new one is ready, so a migration must
        # work with the code before it for one release (add before use,
        # remove after).
        run: scripts/migrate-production.sh facewoof:deploy apply

      - name: Azure logout
        if: always()
        run: az logout || true

  deploy:
    needs: [target, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      # Required for the OIDC token azure/login exchanges for credentials.
      # There is no client secret stored anywhere as a result.
      contents: read
      id-token: write

    env:
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE: facewoof
      CONTAINER_APP: ${{ vars.CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SHA: ${{ needs.target.outputs.sha }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push the image
        # AcrPush plus Reader on the registry, nothing more.
        run: |
          set -euo pipefail
          az acr login --name "${REGISTRY%%.*}"
          for tag in "$SHA" "run-${{ github.run_id }}" latest; do
            docker tag facewoof:deploy "$REGISTRY/$IMAGE:$tag"
            docker push "$REGISTRY/$IMAGE:$tag"
          done

      - name: Deploy the revision
        # The per-run tag, not the commit tag. A workflow_dispatch of the same
        # commit rebuilds and pushes the same :sha tag, and `az containerapp
        # update` treats an unchanged image reference as nothing to do — the
        # new build sat in the registry while production kept serving the old
        # one, and the run still reported success because the old revision was
        # healthy. A reference that is unique per run makes every run a real
        # rollout, which is the entire point of the manual trigger.
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/$IMAGE:run-${{ github.run_id }}"

      - name: Wait for the new revision to be healthy
        # `az containerapp update` returns once the revision is created, not
        # once it is serving. Without this a broken deploy looks green.
        run: |
          set -euo pipefail
          # Through the public domain (Cloudflare), not the origin FQDN:
          # ingress is being restricted to Cloudflare's IPs, so the origin
          # no longer answers the runner directly.
          fqdn=facewoof.abera.tech
          echo "checking https://$fqdn/healthz"
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 10 "https://$fqdn/healthz" > /tmp/health.json; then
              cat /tmp/health.json
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "revision did not become healthy within five minutes"
          az containerapp logs show --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" --tail 50 || true
          exit 1

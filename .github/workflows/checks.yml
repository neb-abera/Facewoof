name: checks

on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: eslint and prettier
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Playwright versions in lockstep
        # The e2e image tag and @playwright/test must be the same exact
        # version (see the Dockerfile's e2e stage). Dependabot bumps them in
        # separate PRs — docker and npm — so this fails the first PR fast
        # and clearly; merging its counterpart clears it.
        run: |
          image="$(sed -n 's|^FROM mcr\.microsoft\.com/playwright:v\([0-9.]*\)-.* AS e2e$|\1|p' Dockerfile)"
          pkg="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          echo "Dockerfile e2e image: $image / @playwright/test: $pkg"
          if [ -z "$image" ] || [ "$image" != "$pkg" ]; then
            echo "::error::Playwright version mismatch: Dockerfile e2e image is '$image' but @playwright/test is '$pkg'. Merge the matching Dependabot PR for the other ecosystem."
            exit 1
          fi
      - name: Lint and format check
        # The check is a build step, so it runs on the same node as everything
        # else and against a copy of the tree rather than a mount.
        run: docker build --target lint .

  build:
    name: production image
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the image the deploy pipeline builds
        run: docker build --target final -t facewoof .

  smoke:
    name: smoke test against postgres
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: facewoof
          POSTGRES_PASSWORD: facewoof
          POSTGRES_DB: facewoof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U facewoof -d facewoof"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Roster is reproducible
        # A committed roster that no longer matches its generator is a trap for
        # the next person who regenerates it.
        run: |
          python3 server/db/migrations/generate-roster.py
          git diff --exit-code -- server/db/migrations/0002_demo_roster.sql

      - name: Build, migrate and start
        run: |
          docker build --target final -t facewoof .
          # Migrations run from the image, the same way production does.
          docker run --rm --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            facewoof npm run migrate
          # And again on start-up, which must be a no-op.
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e INSECURE_TRANSPORT=true \
            -e GUEST_LIMIT_PER_HOUR=200 \
            -e PORT=8080 facewoof
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break || sleep 2
          done

      - name: The demo actually shows dogs
        run: |
          set -euo pipefail
          curl -sf http://localhost:8080/healthz

          # Signing in sets the session cookie, and every /api route needs it.
          curl -sf -c /tmp/jar -X POST http://localhost:8080/api/auth/guest \
            -H 'content-type: application/json' -d '{"zip":"60601"}' > /dev/null

          N=$(curl -sf -b /tmp/jar \
            "http://localhost:8080/api/discover?zipcode=60601&radius=25&limit=10" \
            | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["users"]))')
          echo "discover returned $N dogs"
          test "$N" -gt 0

      - name: An unauthenticated caller is refused
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/api/discover?zipcode=60601")
          echo "no cookie -> $code"
          test "$code" = "401"

      - name: Browser tests
        # The API checks above cannot see any of this: blocked images, alt text
        # rendered in place of a photo, an overlay hidden behind the search bar,
        # a call to action that needs two clicks. All four of those reached
        # production because nothing opened the app in a browser.
        run: |
          docker build --target e2e -t facewoof-e2e .
          docker run --rm --network host -e CI=true \
            -e BASE_URL=http://localhost:8080 facewoof-e2e

      - name: Sign-in, against a mock provider
        # Entra sign-in is only reachable with a tenant configured, so without
        # this the sign-in tests would skip in CI and the flow would be covered
        # by nothing. The mock speaks real OIDC — discovery, PKCE, a signed
        # id_token and a published JWKS — so signature verification, state and
        # nonce are genuinely exercised. No Azure credentials involved.
        run: |
          set -euo pipefail
          docker run -d --name oidc-mock --network host \
            -e PORT=9000 -e ISSUER=http://localhost:9000 -e CLIENT_ID=facewoof-ci \
            -v "$PWD/tests/oidc-mock/server.js:/app/server.js:ro" \
            -w /app facewoof node /app/server.js
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/.well-known/openid-configuration >/dev/null && break || sleep 2
          done

          docker rm -f app
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e INSECURE_TRANSPORT=true \
            -e GUEST_LIMIT_PER_HOUR=200 \
            -e PORT=8080 \
            -e ENTRA_PROVIDERS=email,google \
            -e ENTRA_ISSUER=http://localhost:9000 \
            -e ENTRA_CLIENT_ID=facewoof-ci \
            -e ENTRA_CLIENT_SECRET=ci-only-not-a-real-secret \
            -e ENTRA_REDIRECT_URI=http://localhost:8080/api/auth/oidc/callback \
            facewoof
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break || sleep 2
          done

          docker run --rm --network host -e CI=true \
            -e BASE_URL=http://localhost:8080 \
            -e ENTRA_PROVIDERS=email,google \
            -e ENTRA_ISSUER=http://localhost:9000 \
            facewoof-e2e npx playwright test sign-in --workers=1

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Server logs
        if: always()
        run: docker logs app || true

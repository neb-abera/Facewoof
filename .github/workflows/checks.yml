name: checks

# Bare pull_request, deliberately: several jobs here are required contexts
# under strict branch protection, and a branches filter would leave a PR
# whose base is a feature branch waiting forever on checks that never run.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Outside a pull request each commit gets its own group. A group holds one
# running and one pending run, and a third run cancels the pending one
# whatever cancel-in-progress says. Keyed by branch, that left aberaTech
# 2d7cced and aab70ed with no checks on 2026-09-26. On a pull request a
# newer push still cancels the older run. scripts/check-concurrency.sh
# enforces this.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # A secret cannot be used in `if:` directly, so it is routed through
    # job-level env for the Codecov step below.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution step below reads every commit this pull request
          # would add, and a shallow clone has no merge base to measure the
          # range from.
          fetch-depth: 0
          persist-credentials: false
      - name: Lint and format check
        # The check is a build step, so it runs on the same node as everything
        # else and against a copy of the tree rather than a mount.
        run: docker build --target lint .

      - name: No dependency is held behind a major that cannot install
        # Dependabot only opens a pull request for a bump that installs, so a
        # major whose peer range the manifest cannot satisfy is never offered
        # and nothing goes red (openapi-typescript sat at 6 for two years that
        # way). A `docker run`, not a build stage: the answer depends on the
        # registry, and a cached layer would never ask again. The self-test
        # runs first, every time, so a check that can no longer fail is caught.
        run: |
          set -euo pipefail
          scripts/check-held-majors.sh --self-test
          scripts/check-held-majors.sh

      - name: Node on its newest GA major
        # The newest GA Node major, LTS or not. Fails on a Dependabot range
        # holding a major back, and on a node image 45 days behind the newest
        # major. It reads nodejs.org/dist/index.json: exit 2 is an outage,
        # not a finding.
        run: |
          set -euo pipefail
          scripts/check-newest-majors.sh --self-test
          scripts/check-newest-majors.sh

      - name: Markdown passes the writing rules
        # The writing rules (.vale/styles/Abera) over every tracked Markdown
        # file. The self-test runs first, every time: every rule must fire on
        # a fixture that carries one violation each, and a clean fixture must
        # pass, so a rule that has stopped matching is caught before it is
        # trusted.
        run: |
          set -euo pipefail
          scripts/check-prose.sh --self-test
          scripts/check-prose.sh

      - name: No commit in this pull request credits an AI
        # Nothing published under Neb's name credits an AI. The commit-msg
        # hook and the Claude PreToolUse gate both run on the machine making
        # the commit, so neither sees one made anywhere they are not
        # installed. On 2026-09-24 a branch cut from a pre-rewrite master put
        # 45 stripped lines back on aberaTech's default branch, which took a
        # second rewrite and a force push to undo. This runs where the merge
        # happens. A step on this job rather than a job of its own so the
        # branch protection's required contexts stay as they are.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          scripts/check-attribution.sh --self-test
          scripts/check-attribution.sh "origin/${GITHUB_BASE_REF}..HEAD"

      - name: Unit tests
        # --progress=plain and a tee so the vitest totals the build prints
        # can be lifted into the job summary without running anything twice.
        run: |
          set -euo pipefail
          docker build --progress=plain --target unittest -t facewoof-unittest . 2>&1 | tee unittest.log

      # Parses the vitest summaries already in the log — never re-runs tests.
      # The unittest stage runs the server's unit tests, prints a marker, then
      # the client's component tests; each half is summarised on its own row.
      - name: Append test totals to the job summary
        run: |
          set -euo pipefail
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          clean="$(sed 's/\x1b\[[0-9;]*m//g' unittest.log)"
          server="$(sed '/::client-tests::/,$d' <<<"$clean")"
          client="$(sed -n '/::client-tests::/,$p' <<<"$clean")"
          row() {
            local name="$1" log="$2"
            local passed failed coverage
            passed="$(grep ' Tests ' <<<"$log" | grep -Eo '[0-9]+ passed' | grep -Eo '[0-9]+' | tail -1 || true)"
            failed="$(grep ' Tests ' <<<"$log" | grep -Eo '[0-9]+ failed' | grep -Eo '[0-9]+' | tail -1 || true)"
            coverage="$(grep -E 'All files' <<<"$log" | grep -Eo '[0-9]+(\.[0-9]+)?' | tail -1 || true)"
            [ -n "${passed:-}" ] || return 0
            echo "| ${name} | ${passed} | ${failed:-0} | ${coverage:-?}% |"
          }
          {
            echo "### Unit and component tests (vitest, in-container)"
            echo ""
            echo "| Suite | Tests passed | Tests failed | Line coverage |"
            echo "| --- | --- | --- | --- |"
            row "server (tests/unit)" "$server"
            row "client (tests/client)" "$client"
          } >> "$GITHUB_STEP_SUMMARY"

      # The two lcov reports the stage wrote (vite.config.ts and
      # vitest.client.config.ts name the directories), lifted out of the
      # image the build just tagged. Dashboard only: the blocking floors are
      # vitest's own thresholds, which failed the build above if crossed, so
      # the gate works with or without a Codecov account.
      - name: Coverage reports out of the test image
        if: env.CODECOV_TOKEN != ''
        run: |
          set -euo pipefail
          id="$(docker create facewoof-unittest)"
          docker cp "$id:/app/coverage" coverage-artifacts
          docker rm "$id" > /dev/null
          ls -l coverage-artifacts/server/lcov.info coverage-artifacts/client/lcov.info

      - name: Upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-artifacts/server/lcov.info,coverage-artifacts/client/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: production image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image the deploy pipeline builds
        run: docker build --target final -t facewoof .

      - name: The bundle is within its budget
        # gzip bytes of what a first visit downloads - the entry script, the
        # stylesheet, the preloaded chunks and the document - against
        # bundle-budget.json, measured inside the image just built. Bytes,
        # not timings, so it cannot flake. The failure path is proved by
        # tests/unit/bundle-budget.test.ts in the unit job.
        run: IMAGE=facewoof scripts/check-bundle-budget.sh

      - name: The image runs as a non-root user
        # The Dockerfile drops to `node` before the CMD; assert it stayed
        # dropped so a refactor cannot silently ship a root container.
        run: |
          set -euo pipefail
          user="$(docker inspect --format '{{.Config.User}}' facewoof)"
          echo "Config.User = '${user}'"
          case "$user" in
            ""|0|root)
              echo "::error::production image runs as root (Config.User='${user}')"
              exit 1
              ;;
          esac

  smoke:
    name: smoke test against postgres
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: build
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job builds/runs containers, and container-side
          # DNS bypasses harden-runner's resolver, so blocked lookups surface as
          # refused raw-IP dials. Host-process jobs stay on block.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the database compose.yaml pins
        # The same `db` service `make dev` runs, not a copy of its image tag:
        # this job once named postgres:17-alpine while compose had moved to 18
        # and production (Azure flexible server) was on 18 too, so the smoke
        # test ran against a major nothing else used. One source now —
        # compose.yaml, which Dependabot's docker-compose ecosystem bumps —
        # and the job cannot drift from it. The service publishes 5432 on the
        # loopback, which is where the --network host containers below look.
        run: docker compose up -d --wait db

      - name: Roster is reproducible
        # A committed roster that no longer matches its generator is a trap for
        # the next person who regenerates it.
        run: |
          set -euo pipefail
          python3 server/db/migrations/generate-roster.py
          git diff --exit-code -- server/db/migrations/0002_demo_roster.sql

      - name: Build, migrate and start
        run: |
          set -euo pipefail
          docker build --target final -t facewoof .
          # Migrations run from the image as their own step, the same way
          # the deploy workflow's migrate job does.
          docker run --rm --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            facewoof npm run migrate
          # Outside development the server does not migrate at start-up. It
          # checks the ledger and refuses to serve a schema that is behind.
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e INSECURE_TRANSPORT=true \
            -e GUEST_LIMIT_PER_HOUR=600 \
            -e PUBLIC_LIMIT_PER_MINUTE=6000 \
            -e FEED_LIMIT_PER_MINUTE=6000 \
            -e API_LIMIT_PER_FIVE_MINUTES=6000 \
            -e PORT=8080 facewoof
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz; then break; fi
            sleep 2
          done

      - name: Row types match the schema
        # server/db/rows.ts is generated from the schema and committed, so
        # every query typed by it is checked without a database. Regenerate
        # against the migrated database this job just built and diff: a
        # migration that renames a column fails here until the types, and so
        # the queries, are brought up to date.
        env:
          IMAGE: facewoof
          DATABASE_URL: postgres://facewoof:facewoof@localhost:5432/facewoof
        run: scripts/check-rows.sh

      - name: Database tests
        # tests/db: what the SQL does, against the database this job just
        # migrated - today, that two rate limiter instances sharing it count
        # one caller together, which is the whole reason the counts moved out
        # of process memory. The runner is a Dockerfile stage, so it is the
        # same node and the same lockfile as everything else.
        run: |
          set -euo pipefail
          docker build --target dbtest -t facewoof-dbtest .
          docker run --rm --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            facewoof-dbtest

      - name: The demo actually shows dogs
        run: |
          set -euo pipefail
          curl -sf http://localhost:8080/healthz

          # Signing in sets the session cookie, and every /api route needs it.
          # A state-changing request also needs the CSRF token: make an API
          # GET first to receive the XSRF-TOKEN cookie, then echo it back in
          # the header, exactly as the in-app client does (the jar stores the
          # value percent-encoded, so decode it). An API GET, not the page:
          # the document and the bundle are served without cookies so the CDN
          # can cache them.
          curl -sf -c /tmp/jar http://localhost:8080/api/auth/providers > /dev/null
          TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.unquote(next(l.split()[-1] for l in open('/tmp/jar') if 'XSRF-TOKEN' in l)))")
          curl -sf -b /tmp/jar -c /tmp/jar -X POST http://localhost:8080/api/auth/guest \
            -H "x-xsrf-token: $TOKEN" \
            -H 'content-type: application/json' -d '{"zip":"60601"}' > /dev/null

          N=$(curl -sf -b /tmp/jar -X POST http://localhost:8080/api/discover \
            -H "x-xsrf-token: $TOKEN" -H 'content-type: application/json' \
            -d '{"zipcode":"60601","radius":25,"limit":10}' \
            | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["users"]))')
          echo "discover returned $N dogs"
          test "$N" -gt 0

      - name: An unauthenticated caller is refused
        run: |
          set -euo pipefail
          # A fresh jar gets its own CSRF token so the refusal proves the
          # missing session, not the missing token.
          curl -sf -c /tmp/anonjar http://localhost:8080/api/auth/providers > /dev/null
          ANON=$(python3 -c "import urllib.parse; print(urllib.parse.unquote(next(l.split()[-1] for l in open('/tmp/anonjar') if 'XSRF-TOKEN' in l)))")
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -b /tmp/anonjar -X POST http://localhost:8080/api/discover \
            -H "x-xsrf-token: $ANON" -H 'content-type: application/json' \
            -d '{"zipcode":"60601"}')
          echo "no session -> $code"
          test "$code" = "401"

      - name: Browser tests
        # The API checks above cannot see any of this: blocked images, alt text
        # rendered in place of a photo, an overlay hidden behind the search bar,
        # a call to action that needs two clicks. All four of those reached
        # production because nothing opened the app in a browser.
        #
        # The script runs the suite in Playwright's image at the exact version
        # package.json pins, so there is no second pin for Dependabot to bump
        # out of step.
        run: E2E_NETWORK=host CI=true BASE_URL=http://localhost:8080 scripts/e2e.sh

      - name: DAST baseline (OWASP ZAP)
        # An attacker's-eye scan of the running production image. Accepted
        # findings live in .zap/rules.tsv with their reasoning.
        run: |
          docker run --rm --network host -v "$PWD/.zap":/zap/wrk:ro \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv

      - name: Sign-in, against a mock provider
        # Entra sign-in is only reachable with a tenant configured, so without
        # this the sign-in tests would skip in CI and the flow would be covered
        # by nothing. The mock speaks real OIDC — discovery, PKCE, a signed
        # id_token and a published JWKS — so signature verification, state and
        # nonce are genuinely exercised. No Azure credentials involved.
        run: |
          set -euo pipefail
          docker run -d --name oidc-mock --network host \
            -e PORT=9000 -e ISSUER=http://localhost:9000 -e CLIENT_ID=facewoof-ci \
            -v "$PWD/tests/oidc-mock/server.ts:/app/server.ts:ro" \
            -w /app facewoof node /app/server.ts
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done

          docker rm -f app
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://facewoof:facewoof@localhost:5432/facewoof \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e INSECURE_TRANSPORT=true \
            -e GUEST_LIMIT_PER_HOUR=600 \
            -e PUBLIC_LIMIT_PER_MINUTE=6000 \
            -e FEED_LIMIT_PER_MINUTE=6000 \
            -e API_LIMIT_PER_FIVE_MINUTES=6000 \
            -e PORT=8080 \
            -e ENTRA_PROVIDERS=email,google \
            -e ENTRA_ISSUER=http://localhost:9000 \
            -e ENTRA_CLIENT_ID=facewoof-ci \
            -e ENTRA_CLIENT_SECRET=ci-only-not-a-real-secret \
            -e ENTRA_REDIRECT_URI=http://localhost:8080/api/auth/oidc/callback \
            facewoof
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz; then break; fi
            sleep 2
          done

          E2E_NETWORK=host CI=true BASE_URL=http://localhost:8080 \
            ENTRA_PROVIDERS=email,google ENTRA_ISSUER=http://localhost:9000 \
            scripts/e2e.sh sign-in --workers=1

      - name: Least-privilege database role
        # The serving process is meant to run as a role with no DDL rights,
        # with migrations applied separately by the owner (docs/DEPLOY.md).
        # In a scratch database on the same Postgres: the runtime role is
        # denied CREATE/ALTER/DROP/TRUNCATE/TEMP (after the probe has been
        # seen to fail against the owner), the image refuses to start on an
        # unmigrated schema with its production defaults, and the demo and
        # authorisation specs pass against the image running as that role.
        env:
          IMAGE: facewoof
          CI: "true"
        run: scripts/check-db-roles.sh

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Server logs
        if: always()
        run: docker logs app || true

  # Lint the linters: the workflows and shell scripts every other gate is
  # built out of get no checks from the app toolchain, so a typo'd `if:` or
  # an unquoted variable in an embedded run: block fails silently until it
  # matters. actionlint validates the workflow files (delegating embedded
  # run: blocks to shellcheck). shellcheck covers scripts/*.sh. Both come
  # from the digest-pinned `actionlint` stage of the Dockerfile, the one
  # place their version is written, and `make lint-ci` runs them there.
  workflow-lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Audit, not block: this job runs containers, and container-side
          # DNS bypasses the resolver harden-runner watches. The image layers
          # come from storage hosts that change without notice.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint (workflows, including embedded shell), shellcheck (scripts), workflow concurrency
        run: make lint-ci

      - name: Required checks match the workflows
        # Branch protection requires checks by name. A renamed job here
        # would leave PRs waiting forever on a check that no longer reports,
        # and a new job missing from the list would not block a merge.
        # .github/required-checks is asserted against the workflows in both
        # directions. The self-test plants each failure first.
        run: |
          set -euo pipefail
          scripts/check-required-contexts.sh --self-test
          scripts/check-required-contexts.sh

      - name: Shared files match the template
        # The files .template-parity lists are byte-identical to
        # modern-webapp-template's default branch, or this fails. A change
        # to one of them lands in the template first. The self-test runs
        # first, every time: it plants a drifted and a missing file against
        # a local fixture template and must catch both, so a checker that
        # has stopped failing is caught before it is trusted.
        run: |
          set -euo pipefail
          scripts/check-template-parity.sh --self-test
          scripts/check-template-parity.sh

# Weekly dependency updates; security updates are enabled at the repo level.
#
# Patch and minor bumps arrive grouped — one PR per ecosystem per week instead
# of one per package — and the dependabot-automerge workflow merges those when
# CI is green. Majors are armed too: one that passes every check merges
# itself, and one that genuinely conflicts stays open and red - the human
# queue is the list of open red Dependabot PRs.
#
# Every ecosystem waits out a 5-day cooldown before taking a new release:
# most supply-chain attacks on registries are caught and yanked within days,
# so auto-merging a release published hours ago is the riskiest moment to
# take it. Security updates ignore the cooldown and arrive immediately.
#
# Packages that must move together are grouped at every update level, majors
# included, or a major arrives as two PRs that each fail npm ci. The
# Playwright image is not a second pin any more: scripts/e2e.sh derives it
# from @playwright/test.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # @vitejs/plugin-react 6.1.1, the newest, peers on
      # oxc-transform-react ^0.145.0, which for a 0.x version means 0.145.x
      # only. Dependabot offered 0.150.0 anyway, in the group PR #93, and
      # wrote a lockfile npm ci accepts while a fresh npm install fails with
      # ERESOLVE. Held at 0.145.x until the plugin widens the range, which
      # its own release will do.
      - dependency-name: oxc-transform-react
        versions: [">=0.146.0"]
    groups:
      # vitest and @vitest/* peer-depend on each other's exact version, so a
      # major split across two PRs cannot install in either. First match
      # wins, so this catches the pair before the non-major group does.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # The client type generator's own manifest (tools/api-types/package.json
  # says why it has one). Before it existed openapi-typescript sat in the root
  # manifest held at 6, because 7 peer-depends on typescript ^5.x and the root
  # compiles with TypeScript 7: no bump could ever install, so none was
  # offered and the pin aged in silence.
  - package-ecosystem: npm
    directory: /tools/api-types
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      # The generator drives the TypeScript JavaScript compiler API and
      # declares peer typescript ^5.x. A TypeScript major here cannot install
      # until openapi-typescript widens that range, and its own major is what
      # would do it - that PR arrives unignored. Drop this entry then.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      api-types-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      docker-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # Image tags in compose.yaml (the dev postgres); the docker ecosystem
  # above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      compose-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch

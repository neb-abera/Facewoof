# Weekly dependency updates; security updates are enabled at the repo level.
#
# Patch and minor bumps arrive grouped — one PR per ecosystem per week instead
# of one per package — and the dependabot-automerge workflow merges those when
# CI is green. Majors are armed too: one that passes every check merges
# itself, and one that genuinely conflicts stays open and red - the human
# queue is the list of open red Dependabot PRs.
#
# Every ecosystem waits out a 5-day cooldown before taking a new release:
# most supply-chain attacks on registries are caught and yanked within days,
# so auto-merging a release published hours ago is the riskiest moment to
# take it. Security updates ignore the cooldown and arrive immediately.
#
# Packages that must move together are grouped at every update level, majors
# included, or a major arrives as two PRs that each fail npm ci. The
# Playwright image is not a second pin any more: scripts/e2e.sh derives it
# from @playwright/test.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      # vitest and @vitest/* peer-depend on each other's exact version, so a
      # major split across two PRs cannot install in either. First match
      # wins, so this catches the pair before the non-major group does.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      npm-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      docker-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  # Image tags in compose.yaml (the dev postgres); the docker ecosystem
  # above only scans Dockerfiles.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      compose-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - minor
          - patch

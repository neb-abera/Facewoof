<!doctype html>
<html lang="en" data-theme="facewoof">
  <head>
    <meta charset="UTF-8" />
    <!--
      Versioned on purpose. A browser caches a favicon far more stubbornly than
      it caches a page, and keeps showing the old one long after the file has
      changed — a 404 on /favicon.ico does not clear it either. Bumping ?v=
      makes it a new URL, so the new icon actually appears. Bump it whenever
      the artwork changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Facewoof helps dog owners find nearby dogs to meet, form packs and schedule playdates."
    />
    <!--
      Every dog photo comes from one of these two hosts (the same two the
      CSP's img-src allows): the demo roster from placedog.net, uploads from
      Cloudinary. Opening the connection while the bundle is still parsing
      takes DNS, TCP and TLS off the first photo's critical path. No
      crossorigin attribute: <img> fetches are not CORS requests, and a
      CORS-mode preconnect would open a socket they cannot reuse.
    -->
    <link rel="preconnect" href="https://placedog.net" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <title>Facewoof</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
